<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 Gospel Radios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --bg-base: #0f172a;       
            --surface: #1e293b;       
            --surface-hover: #334155; 
            --accent: #10b981;        
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden; 
            padding: 24px;
        }
        
        /* Contêiner expandido para até 900px de largura */
        #app-container { 
            width: 100%; 
            max-width: 900px; 
            height: 95vh;
            max-height: 1000px;
            display: flex; 
            flex-direction: column; 
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 40px;
            overflow: hidden;
            position: relative;
        }

        .app-header {
            padding: 32px 40px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        /* Título aumentado */
        .app-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-gear {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .admin-gear:hover {
            color: var(--text-main);
            transform: rotate(45deg);
        }

        .station-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
        }

        /* Círculo central expandido para 280px */
        .station-icon {
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 6px solid var(--surface);
            transition: box-shadow 0.3s ease;
            overflow: hidden; /* Garante que a imagem não vaze do círculo */
        }

        .station-icon.playing {
            box-shadow: 0 0 60px var(--accent-glow);
            border-color: #243c33;
        }

        /* Estilo da imagem centralizada no player */
        .app-logo-center {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Nome da rádio ampliado */
        #stationName {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-main);
        }

        .status-badge {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 20px;
            border-radius: 24px;
            background: var(--surface);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-badge.active .status-dot {
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
        }

        .status-badge.active {
            color: var(--accent);
            background: rgba(16, 185, 129, 0.1);
        }

        /* Equalizador redimensionado */
        .eq-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 6px;
            height: 100px;
            margin: 32px 0;
            padding: 0 40px;
        }

        .eq-bar {
            flex: 1;
            background: var(--surface-hover);
            border-radius: 6px;
            height: 100%;
            transform-origin: bottom;
            transform: scaleY(0.05); 
            transition: transform 0.05s ease;
        }

        .eq-bar.active {
            background: var(--accent);
        }

        #statusMessage {
            text-align: center;
            font-size: 16px;
            color: var(--text-muted);
            margin-top: -16px;
            margin-bottom: 16px;
            min-height: 24px;
        }

        /* Barra de volume aumentada */
        .volume-container {
            padding: 0 48px 32px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .volume-icon {
            color: var(--text-muted);
            width: 24px;
            height: 24px;
        }

        .volume-slider {
            flex: 1;
            height: 10px;
            background: var(--surface);
            border-radius: 5px;
            position: relative;
            cursor: pointer;
        }

        .volume-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--text-main);
            border-radius: 5px;
            pointer-events: none;
            transition: width 0.1s;
        }

        .volume-knob {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            pointer-events: none;
            transition: left 0.1s;
        }

        /* Botões de controle redimensionados */
        .controls-container {
            padding: 32px 48px 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: var(--bg-base);
            border-top: 1px solid var(--border-color);
        }

        .control-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, color 0.2s;
        }

        .control-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .control-btn:hover {
            color: var(--accent);
            transform: scale(1.1);
        }

        .control-btn.play-btn {
            width: 96px;
            height: 96px;
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            box-shadow: 0 15px 30px var(--accent-glow);
        }

        .control-btn.play-btn:hover {
            transform: scale(1.05);
            background: #0ea5e9; 
            color: #fff;
        }

        .control-btn.play-btn svg {
            width: 48px;
            height: 48px;
            margin-left: 6px; 
        }

        .control-btn.play-btn.is-playing svg {
            margin-left: 0; 
        }

        /* Modais */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 0.2s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            width: 100%;
            max-width: 500px;
            padding: 32px;
            box-shadow: 0 35px 60px -15px rgba(0,0,0,0.6);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text-main);
        }

        .stations-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .station-item {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .station-item:hover {
            border-color: var(--accent);
            background: rgba(16, 185, 129, 0.05);
        }

        .station-item.selected {
            border-color: var(--accent);
            background: rgba(16, 185, 129, 0.1);
        }

        .station-item-icon {
            width: 40px;
            height: 40px;
            background: var(--surface);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        .station-item-name {
            font-weight: 600;
            font-size: 18px;
        }

        .btn-modern {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-align: center;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .btn-secondary {
            background: var(--surface-hover);
            color: var(--text-main);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }
        
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 12px;
        }

        .input-modern {
            width: 100%;
            padding: 16px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-modern:focus {
            border-color: var(--accent);
        }

        .admin-tape-item {
            background: var(--bg-base);
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }
        .admin-tape-item label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        #loadingIndicator {
            position: absolute;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #fff;
            padding: 8px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            z-index: 50;
            box-shadow: 0 6px 16px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="loadingIndicator">Conectando...</div>

        <!-- Cabeçalho (Logo removido daqui e título alinhado) -->
        <div class="app-header">
            <h1>Top 10 Gospel Radios</h1>
            <button class="admin-gear" id="adminBtn" title="Configurações">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
            </button>
        </div>

        <!-- Palco Central com o Logotipo Substituindo a Nota Musical -->
        <div class="station-display">
            <div class="station-icon" id="mainIcon">
                <img src="Sint.jpg" alt="Logo Sintonize Gospel" class="app-logo-center">
            </div>
            
            <div class="track-info">
                <div id="stationName">Rádio Aleluia</div>
                <div class="status-badge" id="statusBadge">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">STANDBY</span>
                </div>
            </div>
        </div>

        <!-- Equalizador -->
        <div class="eq-container" id="eqContainer">
            <!-- As barras serão geradas via JS -->
        </div>

        <div id="statusMessage">Pronto para tocar.</div>

        <!-- Volume -->
        <div class="volume-container">
            <svg class="volume-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <div class="volume-slider" id="volumeSlider">
                <div class="volume-fill" id="volumeFill" style="width: 50%;"></div>
                <div class="volume-knob" id="volumeKnob" style="left: 50%;"></div>
            </div>
        </div>

        <!-- Controles -->
        <div class="controls-container">
            <button class="control-btn" id="listBtn" title="Estações">
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            </button>
            
            <button class="control-btn play-btn" id="mainPlayBtn" title="Play/Pause">
                <svg id="playIconSVG" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            
            <button class="control-btn" id="stopBtn" title="Parar">
                <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
            </button>
        </div>
    </div>

    <!-- Modal de Estações -->
    <div class="modal-overlay" id="stationModal">
        <div class="modal-content">
            <div class="modal-header">Selecione uma Estação</div>
            <div class="stations-list" id="stationsList"></div>
            <button class="btn-modern btn-secondary" id="closeStationModal">FECHAR</button>
        </div>
    </div>

    <!-- Modal de Senha -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-content">
            <div class="modal-header">Área Restrita</div>
            <p style="text-align:center; font-size: 16px; color: var(--text-muted); margin-bottom: 24px;">Digite a senha de administrador</p>
            <input type="password" id="adminPassword" class="input-modern" placeholder="••••••" maxlength="20">
            <div id="passwordError" style="color: #ef4444; font-size: 14px; text-align: center; display: none; margin-bottom: 16px;">Senha incorreta!</div>
            
            <button class="btn-modern btn-primary" id="enterAdminBtn">ENTRAR</button>
            <button class="btn-modern btn-secondary" id="cancelPasswordBtn">CANCELAR</button>
        </div>
    </div>

    <!-- Modal Admin -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">Gerenciar Estações</div>
            <div id="adminStationsList"></div>
            
            <button class="btn-modern btn-primary" id="saveAdminBtn" style="margin-bottom: 12px;">💾 SALVAR ALTERAÇÕES</button>
            <button class="btn-modern btn-secondary" id="downloadHTMLBtn" style="color: var(--accent); border: 1px solid var(--accent);">📥 GERAR NOVO HTML</button>
            <button class="btn-modern btn-danger" id="cancelAdminBtn">CANCELAR</button>
        </div>
    </div>

    <audio id="audioElement" crossorigin="anonymous" preload="none"></audio>

    <script>
        (function() {
            const audio = document.getElementById('audioElement');
            const stationName = document.getElementById('stationName');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const statusMessage = document.getElementById('statusMessage');
            
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const mainIcon = document.getElementById('mainIcon');
            
            const eqContainer = document.getElementById('eqContainer');
            
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeFill = document.getElementById('volumeFill');
            const volumeKnob = document.getElementById('volumeKnob');
            
            const stationModal = document.getElementById('stationModal');
            const stationsList = document.getElementById('stationsList');
            const closeStationModal = document.getElementById('closeStationModal');
            
            const adminBtn = document.getElementById('adminBtn');
            const passwordModal = document.getElementById('passwordModal');
            const adminPassword = document.getElementById('adminPassword');
            const passwordError = document.getElementById('passwordError');
            const enterAdminBtn = document.getElementById('enterAdminBtn');
            const cancelPasswordBtn = document.getElementById('cancelPasswordBtn');
            
            const adminModal = document.getElementById('adminModal');
            const adminStationsList = document.getElementById('adminStationsList');
            const saveAdminBtn = document.getElementById('saveAdminBtn');
            const downloadHTMLBtn = document.getElementById('downloadHTMLBtn');
            const cancelAdminBtn = document.getElementById('cancelAdminBtn');
            
            const mainPlayBtn = document.getElementById('mainPlayBtn');
            const playIconSVG = document.getElementById('playIconSVG');
            const stopBtn = document.getElementById('stopBtn');
            const listBtn = document.getElementById('listBtn');
            
            const iconPlay = '<path d="M8 5v14l11-7z"/>';
            const iconPause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            
            const ADMIN_PASSWORD = "602190";
            
            let tapes = [
                { name: "Rádio Aleluia", color: "white", url: "http://64.95.243.43:8002/stream" },
                { name: "Louvor FM", color: "black", url: "https://ella.do-not-publish.com/ella-jazz-ballads" },
                { name: "Nova Vida", color: "clear", url: "https://jazz-wr03.ice.infomaniak.ch/jazz-wr03-128.mp3" },
                { name: "Gospel Hits", color: "white", url: "https://strm112.1.fm/bossanova_mobile_mp3" },
                { name: "Rádio Paz", color: "black", url: "http://ella.do-not-publish.com/ella-swing-and-bigband" },
                { name: "Voz da Esperança", color: "clear", url: "https://ella.do-not-publish.com/ella-modern-vocal-jazz" }
            ];
            
            let currentStreamUrl = tapes[0].url;
            let isPlaying = false;
            let isPaused = false;
            let animationFrame = null;
            let selectedTapeIndex = 0;
            
            const BAR_COUNT = 16;
            const eqBars = [];
            
            function createEQBars() {
                eqContainer.innerHTML = '';
                for (let i = 0; i < BAR_COUNT; i++) {
                    let bar = document.createElement('div');
                    bar.className = 'eq-bar';
                    eqContainer.appendChild(bar);
                    eqBars.push(bar);
                }
            }
            createEQBars();
            
            function createStationsList() {
                stationsList.innerHTML = '';
                tapes.forEach((tape, index) => {
                    const item = document.createElement('div');
                    item.className = `station-item ${index === selectedTapeIndex ? 'selected' : ''}`;
                    item.innerHTML = `
                        <div class="station-item-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        </div>
                        <div class="station-item-name">${tape.name}</div>
                    `;
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.station-item').forEach(el => el.classList.remove('selected'));
                        item.classList.add('selected');
                        selectedTapeIndex = index;
                        currentStreamUrl = tape.url;
                        stationName.textContent = tape.name;
                        stationModal.style.display = 'none';
                        
                        if (isPlaying && !isPaused) {
                            playStream(currentStreamUrl);
                        } else {
                            stopAll();
                        }
                    });
                    stationsList.appendChild(item);
                });
            }
            createStationsList();
            
            function createAdminTapes() {
                adminStationsList.innerHTML = '';
                tapes.forEach((tape, index) => {
                    const item = document.createElement('div');
                    item.className = 'admin-tape-item';
                    item.innerHTML = `
                        <label>ESTAÇÃO ${index + 1} - NOME</label>
                        <input type="text" class="input-modern tape-name-input" data-index="${index}" value="${tape.name}">
                        <label>URL DO STREAM</label>
                        <input type="text" class="input-modern tape-url-input" data-index="${index}" value="${tape.url}">
                    `;
                    adminStationsList.appendChild(item);
                });
            }
            
            function collectTapesFromAdmin() {
                const newTapes = [];
                const nameInputs = document.querySelectorAll('.tape-name-input');
                const urlInputs = document.querySelectorAll('.tape-url-input');
                
                for (let i = 0; i < 6; i++) {
                    newTapes.push({
                        name: nameInputs[i].value,
                        url: urlInputs[i].value,
                        color: tapes[i].color 
                    });
                }
                return newTapes;
            }
            
            function updateTapes(newTapes) {
                tapes = newTapes;
                currentStreamUrl = tapes[selectedTapeIndex].url;
                stationName.textContent = tapes[selectedTapeIndex].name;
                createStationsList();
            }
            
            function generateNewHTML() {
                const newTapes = collectTapesFromAdmin();
                const currentHTML = document.documentElement.outerHTML;
                const tapesString = JSON.stringify(newTapes, null, 4)
                    .replace(/"([^"]+)":/g, '$1:') 
                    .replace(/"/g, "'"); 
                
                const newHTML = currentHTML.replace(
                    /let tapes = \[[\s\S]*?\];/,
                    `let tapes = ${tapesString};`
                );
                
                const blob = new Blob([newHTML], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sintonizegospel-${new Date().toISOString().slice(0,10)}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                statusMessage.textContent = 'Novo HTML gerado! Verifique downloads.';
                setTimeout(() => { statusMessage.textContent = ''; }, 3000);
            }
            
            function setVolume(percent) {
                let vol = Math.max(0, Math.min(1, percent / 100));
                audio.volume = vol;
                volumeFill.style.width = (vol * 100) + '%';
                volumeKnob.style.left = (vol * 100) + '%';
            }
            
            volumeSlider.addEventListener('mousedown', (e) => {
                const updateVolume = (ev) => {
                    const rect = volumeSlider.getBoundingClientRect();
                    const x = ev.clientX - rect.left;
                    setVolume((x / rect.width) * 100);
                };
                updateVolume(e);
                
                const onMouseMove = (ev) => updateVolume(ev);
                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
            
            volumeSlider.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const updateVolume = (ev) => {
                    const rect = volumeSlider.getBoundingClientRect();
                    const touch = ev.touches[0];
                    const x = touch.clientX - rect.left;
                    setVolume((x / rect.width) * 100);
                };
                updateVolume(e);
                
                const onTouchMove = (ev) => updateVolume(ev);
                const onTouchEnd = () => {
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };
                
                document.addEventListener('touchmove', onTouchMove, {passive: false});
                document.addEventListener('touchend', onTouchEnd);
            }, {passive: false});
            
            function updateStatusUI(state) {
                if (state === 'playing') {
                    statusBadge.classList.add('active');
                    statusText.textContent = 'ON AIR';
                    mainIcon.classList.add('playing');
                    mainPlayBtn.classList.add('is-playing');
                    playIconSVG.innerHTML = iconPause;
                } else if (state === 'paused') {
                    statusBadge.classList.remove('active');
                    statusText.textContent = 'PAUSADO';
                    mainIcon.classList.remove('playing');
                    mainPlayBtn.classList.remove('is-playing');
                    playIconSVG.innerHTML = iconPlay;
                } else {
                    statusBadge.classList.remove('active');
                    statusText.textContent = 'STANDBY';
                    mainIcon.classList.remove('playing');
                    mainPlayBtn.classList.remove('is-playing');
                    playIconSVG.innerHTML = iconPlay;
                    eqBars.forEach(bar => {
                        bar.style.transform = 'scaleY(0.05)';
                        bar.classList.remove('active');
                    });
                }
            }
            
            function stopAll() {
                audio.pause();
                audio.src = '';
                audio.load();
                isPlaying = false;
                isPaused = false;
                updateStatusUI('standby');
                if (window.audioCtx) {
                    window.audioCtx.suspend();
                }
            }
            
            async function playStream(url) {
                try {
                    loadingIndicator.style.display = 'block';
                    statusMessage.textContent = '';
                    
                    audio.src = url;
                    audio.load();
                    
                    const playPromise = audio.play();
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error('Timeout')), 10000)
                    );
                    
                    await Promise.race([playPromise, timeoutPromise]);
                    
                    if (!window.audioCtx) {
                        window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        window.source = window.audioCtx.createMediaElementSource(audio);
                        window.analyser = window.audioCtx.createAnalyser();
                        window.analyser.fftSize = 64; 
                        window.analyser.smoothingTimeConstant = 0.85;
                        window.source.connect(window.analyser);
                        window.analyser.connect(window.audioCtx.destination);
                        window.dataArray = new Uint8Array(window.analyser.frequencyBinCount);
                    } else if (window.audioCtx.state === 'suspended') {
                        await window.audioCtx.resume();
                    }
                    
                    isPlaying = true;
                    isPaused = false;
                    loadingIndicator.style.display = 'none';
                    updateStatusUI('playing');
                    
                    function renderRealEQ() {
                        if (!isPlaying || isPaused) {
                            animationFrame = requestAnimationFrame(renderRealEQ);
                            return;
                        }
                        
                        try {
                            window.analyser.getByteFrequencyData(window.dataArray);
                            
                            for (let i = 0; i < BAR_COUNT; i++) {
                                let val = window.dataArray[i + 2] / 255; 
                                let scaleY = Math.max(0.05, val * 1.5); 
                                
                                eqBars[i].style.transform = `scaleY(${Math.min(1, scaleY)})`;
                                
                                if (val > 0.1) {
                                    eqBars[i].classList.add('active');
                                } else {
                                    eqBars[i].classList.remove('active');
                                }
                            }
                        } catch (error) {
                            console.error('EQ error:', error);
                        }
                        
                        animationFrame = requestAnimationFrame(renderRealEQ);
                    }
                    
                    if (animationFrame) cancelAnimationFrame(animationFrame);
                    animationFrame = requestAnimationFrame(renderRealEQ);
                    
                } catch (error) {
                    console.error('Stream error:', error);
                    loadingIndicator.style.display = 'none';
                    statusMessage.textContent = 'Erro ao conectar à estação.';
                    updateStatusUI('standby');
                }
            }
            
            mainPlayBtn.addEventListener('click', () => {
                if (!isPlaying) {
                    playStream(currentStreamUrl);
                } else if (isPlaying && !isPaused) {
                    audio.pause();
                    isPaused = true;
                    updateStatusUI('paused');
                    if (window.audioCtx) window.audioCtx.suspend();
                } else if (isPaused) {
                    audio.play().then(() => {
                        isPaused = false;
                        updateStatusUI('playing');
                        if (window.audioCtx && window.audioCtx.state === 'suspended') {
                            window.audioCtx.resume();
                        }
                    }).catch(err => {
                        playStream(currentStreamUrl);
                    });
                }
            });
            
            stopBtn.addEventListener('click', stopAll);
            
            listBtn.addEventListener('click', () => {
                stationModal.style.display = 'flex';
            });
            
            closeStationModal.addEventListener('click', () => {
                stationModal.style.display = 'none';
            });
            
            adminBtn.addEventListener('click', () => {
                adminPassword.value = '';
                passwordError.style.display = 'none';
                passwordModal.style.display = 'flex';
            });
            
            enterAdminBtn.addEventListener('click', () => {
                if (adminPassword.value === ADMIN_PASSWORD) {
                    passwordModal.style.display = 'none';
                    createAdminTapes();
                    adminModal.style.display = 'flex';
                } else {
                    passwordError.style.display = 'block';
                    adminPassword.value = '';
                    adminPassword.focus();
                }
            });
            
            cancelPasswordBtn.addEventListener('click', () => passwordModal.style.display = 'none');
            
            adminPassword.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') enterAdminBtn.click();
            });
            
            cancelAdminBtn.addEventListener('click', () => adminModal.style.display = 'none');
            
            saveAdminBtn.addEventListener('click', () => {
                const newTapes = collectTapesFromAdmin();
                updateTapes(newTapes);
                adminModal.style.display = 'none';
                statusMessage.textContent = 'Estações atualizadas!';
                setTimeout(() => { statusMessage.textContent = ''; }, 3000);
            });
            
            downloadHTMLBtn.addEventListener('click', () => {
                generateNewHTML();
                adminModal.style.display = 'none';
            });
            
            [stationModal, passwordModal, adminModal].forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) modal.style.display = 'none';
                });
            });
            
            audio.addEventListener('error', () => {
                if (isPlaying) statusMessage.textContent = 'Sinal perdido. Tente outra estação.';
            });
            
            audio.addEventListener('waiting', () => {
                loadingIndicator.style.display = 'block';
                loadingIndicator.textContent = 'Buffering...';
            });
            
            audio.addEventListener('canplay', () => loadingIndicator.style.display = 'none');
            audio.addEventListener('playing', () => {
                loadingIndicator.style.display = 'none';
                statusMessage.textContent = '';
            });
            
            setVolume(50);
            stationName.textContent = tapes[0].name;
            updateStatusUI('standby');
        })();
    </script>
</body>
</html>
