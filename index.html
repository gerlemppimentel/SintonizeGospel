<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 Gospel Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg-base: #0f172a;       
            --surface: #1e293b;       
            --surface-hover: #334155; 
            --accent: #10b981;        
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden; 
            padding: 16px;
        }
        
        #app-container { 
            width: 100%; 
            max-width: 400px; 
            height: 95%;
            max-height: 800px;
            display: flex; 
            flex-direction: column; 
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 32px;
            overflow: hidden;
            position: relative;
        }

        .app-header {
            padding: 24px 24px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
        }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-gear {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .admin-gear:hover { color: var(--text-main); transform: rotate(45deg); }

        .status-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--surface);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444; 
        }

        .status-badge.active .status-dot {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .status-badge.active {
            color: var(--accent);
            background: rgba(16, 185, 129, 0.1);
        }

        .station-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .station-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid var(--surface);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
            overflow: hidden; 
            background-color: var(--bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .station-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .station-icon.playing {
            box-shadow: 0 0 40px var(--accent-glow);
            border-color: var(--accent);
        }

        #stationName {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .vu-meter {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            height: 20px;
            margin: 10px 0 20px 0;
            padding: 0 24px;
            width: 100%;
        }

        .vu-segment {
            flex: 1;
            height: 100%;
            border-radius: 2px;
            background: var(--surface-hover);
            opacity: 0.3;
            transition: opacity 0.05s ease, background 0.1s ease;
        }

        .vu-segment.lit { opacity: 1; }
        .vu-segment.green.lit { background: #10b981; box-shadow: 0 0 5px #10b981; }
        .vu-segment.orange.lit { background: #f59e0b; box-shadow: 0 0 5px #f59e0b; }
        .vu-segment.red.lit { background: #ef4444; box-shadow: 0 0 5px #ef4444; }

        .banner-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 0;
            overflow: hidden;
            white-space: nowrap;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .banner-text {
            display: inline-block;
            font-size: 14px;
            color: var(--text-muted);
            animation: scrollBanner 24s linear infinite; 
        }

        @keyframes scrollBanner {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        .controls-container {
            padding: 24px 32px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-base);
            position: relative;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, color 0.2s;
        }

        .control-btn svg { width: 28px; height: 28px; fill: currentColor; }
        .control-btn:hover { color: var(--accent); transform: scale(1.1); }

        .control-btn.play-btn {
            width: 70px;
            height: 70px;
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        .control-btn.play-btn:hover {
            transform: scale(1.05);
            background: #0ea5e9; 
            color: #fff;
        }

        .volume-wrapper { position: relative; }
        
        .volume-popup {
            position: absolute;
            bottom: 50px;
            left: -10px;
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: none; 
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .volume-popup.show { display: flex; }

        .volume-slider {
            width: 100px;
            height: 6px;
            background: var(--bg-base);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .volume-fill {
            position: absolute;
            top: 0; left: 0; height: 100%;
            background: var(--accent);
            border-radius: 3px;
            pointer-events: none;
        }

        .volume-knob {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-main);
        }

        .stations-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        
        .station-item {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .station-item:hover { border-color: var(--accent); }
        .station-item.selected { border-color: var(--accent); background: rgba(16, 185, 129, 0.1); }

        .circle-number {
            width: 36px;
            height: 36px;
            background: var(--surface-hover);
            color: var(--text-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .station-item.selected .circle-number {
            background: var(--accent);
            border-color: #fff;
            color: #fff;
        }

        .station-item-name { font-weight: 600; font-size: 15px; }

        .btn-modern {
            width: 100%; padding: 14px; border-radius: 12px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
            cursor: pointer; transition: all 0.2s; border: none; text-align: center;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: var(--surface-hover); color: var(--text-main); margin-top: 8px; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); margin-top: 8px; }

        .input-modern {
            width: 100%; padding: 14px; background: var(--bg-base); border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-main); margin-bottom: 12px; outline: none;
        }
        .input-modern:focus { border-color: var(--accent); }

        .admin-tape-item { background: var(--bg-base); padding: 16px; border-radius: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .admin-tape-item label { display: block; font-size: 12px; margin-bottom: 6px; font-weight: 700; color: var(--accent); }

        #loadingIndicator {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #fff; padding: 6px 16px; border-radius: 20px;
            font-size: 12px; font-weight: 600; display: none; z-index: 50;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="loadingIndicator">Conectando...</div>

        <div class="app-header">
            <h1>Top 10 Gospel Radio</h1>
            <div class="header-controls">
                <div class="status-badge" id="statusBadge">
                    <div class="status-dot"></div>
                    <span id="statusText">OFF</span>
                </div>
                <button class="admin-gear" id="adminBtn" title="Configurações">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                </button>
            </div>
        </div>

        <div class="station-display">
            <div class="station-icon" id="mainIcon">
                <img src="Sint.jpg" alt="Rádio Sintonia" onerror="this.style.display='none'">
            </div>
            <div id="stationName">Carregando...</div>
            
            <div class="vu-meter" id="vuMeter">
                <!-- Segmentos gerados via JS -->
            </div>
        </div>

        <div class="banner-container">
            <div class="banner-text" id="runningBanner"></div>
        </div>

        <div class="controls-container">
            <div class="volume-wrapper">
                <button class="control-btn" id="volumeBtn" title="Volume">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <div class="volume-popup" id="volumePopup">
                    <span style="font-size: 11px; font-weight: bold; color: var(--text-muted);">VOLUME</span>
                    <div class="volume-slider" id="volumeSlider">
                        <div class="volume-fill" id="volumeFill" style="width: 50%;"></div>
                        <div class="volume-knob" id="volumeKnob" style="left: 50%;"></div>
                    </div>
                </div>
            </div>
            
            <button class="control-btn play-btn" id="mainPlayBtn" title="Play/Pause">
                <svg id="playIconSVG" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            
            <button class="control-btn" id="listBtn" title="Lista de Rádios">
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="stationModal">
        <div class="modal-content">
            <div class="modal-header">Selecione uma Rádio</div>
            <div class="stations-list" id="stationsList"></div>
            <button class="btn-modern btn-secondary" id="closeStationModal">FECHAR</button>
        </div>
    </div>

    <div class="modal-overlay" id="passwordModal">
        <div class="modal-content">
            <div class="modal-header">Área Restrita</div>
            <p style="text-align:center; font-size: 14px; color: var(--text-muted); margin-bottom: 16px;">Digite a senha (602190)</p>
            <input type="password" id="adminPassword" class="input-modern" placeholder="••••••" maxlength="20">
            <div id="passwordError" style="color: #ef4444; font-size: 12px; text-align: center; display: none; margin-bottom: 16px;">Senha incorreta!</div>
            <button class="btn-modern btn-primary" id="enterAdminBtn">ENTRAR</button>
            <button class="btn-modern btn-secondary" id="cancelPasswordBtn">CANCELAR</button>
        </div>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">Configurações das 10 Rádios</div>
            <div id="adminStationsList"></div>
            <button class="btn-modern btn-primary" id="saveAdminBtn" style="margin-bottom: 8px;">💾 SALVAR ALTERAÇÕES</button>
            <button class="btn-modern btn-danger" id="cancelAdminBtn">CANCELAR</button>
        </div>
    </div>

    <!-- Atributo crossorigin restaurado para o funcionamento exato da estrutura original -->
    <audio id="audioElement" crossorigin="anonymous" preload="none"></audio>

    <script>
        (function() {
            const audio = document.getElementById('audioElement');
            const stationName = document.getElementById('stationName');
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const mainIcon = document.getElementById('mainIcon');
            const vuMeter = document.getElementById('vuMeter');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const runningBanner = document.getElementById('runningBanner');
            
            const mainPlayBtn = document.getElementById('mainPlayBtn');
            const playIconSVG = document.getElementById('playIconSVG');
            const listBtn = document.getElementById('listBtn');
            const volumeBtn = document.getElementById('volumeBtn');
            const volumePopup = document.getElementById('volumePopup');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeFill = document.getElementById('volumeFill');
            const volumeKnob = document.getElementById('volumeKnob');
            
            const stationModal = document.getElementById('stationModal');
            const stationsList = document.getElementById('stationsList');
            const closeStationModal = document.getElementById('closeStationModal');
            
            const adminBtn = document.getElementById('adminBtn');
            const passwordModal = document.getElementById('passwordModal');
            const adminPassword = document.getElementById('adminPassword');
            const passwordError = document.getElementById('passwordError');
            const enterAdminBtn = document.getElementById('enterAdminBtn');
            const cancelPasswordBtn = document.getElementById('cancelPasswordBtn');
            
            const adminModal = document.getElementById('adminModal');
            const adminStationsList = document.getElementById('adminStationsList');
            const saveAdminBtn = document.getElementById('saveAdminBtn');
            const cancelAdminBtn = document.getElementById('cancelAdminBtn');
            
            const iconPlay = '<path d="M8 5v14l11-7z"/>';
            const iconPause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            const ADMIN_PASSWORD = "602190"; 
            
            // URLs originais restauradas com a inclusão de 4 slots vazios para completar os 10 solicitados
            let defaultTapes = [
                { name: "JAZZ SUAVE", url: "http://64.95.243.43:8002/stream", banner: "Você está ouvindo Jazz Suave." },
                { name: "BALADAS JAZZ", url: "https://ella.do-not-publish.com/ella-jazz-ballads", banner: "Bem-vindo à Top 10 Gospel Radio!" },
                { name: "NOVA ORLEANS", url: "https://jazz-wr03.ice.infomaniak.ch/jazz-wr03-128.mp3", banner: "Nova Orleans - Clássicos eternos." },
                { name: "BOSSA NOVA", url: "https://strm112.1.fm/bossanova_mobile_mp3", banner: "Bossa Nova - Ritmo e harmonia." },
                { name: "BIG BAND", url: "http://ella.do-not-publish.com/ella-swing-and-bigband", banner: "Big Band Swing." },
                { name: "VOCAL MODERNO", url: "https://ella.do-not-publish.com/ella-modern-vocal-jazz", banner: "Vocal Moderno Jazz." },
                { name: "SLOT VAZIO 7", url: "", banner: "Edite esta rádio nas configurações." },
                { name: "SLOT VAZIO 8", url: "", banner: "Edite esta rádio nas configurações." },
                { name: "SLOT VAZIO 9", url: "", banner: "Edite esta rádio nas configurações." },
                { name: "SLOT VAZIO 10", url: "", banner: "Edite esta rádio nas configurações." }
            ];
            
            let tapes = JSON.parse(localStorage.getItem('gospelTapes')) || defaultTapes;
            let currentStreamUrl = tapes[0].url;
            let selectedTapeIndex = 0;
            let isPlaying = false;
            let isPaused = false;
            let animationFrame = null;
            
            const TOTAL_VU_SEGMENTS = 15;
            const vuSegments = [];
            
            function createVUMeter() {
                vuMeter.innerHTML = '';
                for (let i = 0; i < TOTAL_VU_SEGMENTS; i++) {
                    let segment = document.createElement('div');
                    segment.className = 'vu-segment';
                    if (i < 9) segment.classList.add('green');
                    else if (i < 12) segment.classList.add('orange');
                    else segment.classList.add('red');
                    vuMeter.appendChild(segment);
                    vuSegments.push(segment);
                }
            }
            createVUMeter();
            
            function createStationsList() {
                stationsList.innerHTML = '';
                tapes.forEach((tape, index) => {
                    const item = document.createElement('div');
                    item.className = `station-item ${index === selectedTapeIndex ? 'selected' : ''}`;
                    item.innerHTML = `
                        <div class="circle-number">${index + 1}</div>
                        <div class="station-item-name">${tape.name}</div>
                    `;
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.station-item').forEach(el => el.classList.remove('selected'));
                        item.classList.add('selected');
                        selectedTapeIndex = index;
                        currentStreamUrl = tape.url;
                        stationName.textContent = tape.name;
                        runningBanner.textContent = tape.banner; 
                        stationModal.style.display = 'none';
                        
                        if (isPlaying && !isPaused) {
                            playStream(currentStreamUrl);
                        } else {
                            audio.src = currentStreamUrl;
                        }
                    });
                    stationsList.appendChild(item);
                });
            }
            
            function createAdminTapes() {
                adminStationsList.innerHTML = '';
                tapes.forEach((tape, index) => {
                    const item = document.createElement('div');
                    item.className = 'admin-tape-item';
                    item.innerHTML = `
                        <label>RÁDIO ${index + 1}</label>
                        <input type="text" class="input-modern tape-name-input" data-index="${index}" value="${tape.name}">
                        <label>LINK DE TRANSMISSÃO (URL)</label>
                        <input type="text" class="input-modern tape-url-input" data-index="${index}" value="${tape.url}">
                        <label>MENSAGEM DO BANNER</label>
                        <input type="text" class="input-modern tape-banner-input" data-index="${index}" value="${tape.banner}">
                    `;
                    adminStationsList.appendChild(item);
                });
            }
            
            volumeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                volumePopup.classList.toggle('show');
            });
            
            document.addEventListener('click', (e) => {
                if (!volumePopup.contains(e.target) && !volumeBtn.contains(e.target)) {
                    volumePopup.classList.remove('show');
                }
            });

            function setVolume(percent) {
                let vol = Math.max(0, Math.min(1, percent / 100));
                audio.volume = vol;
                volumeFill.style.width = (vol * 100) + '%';
                volumeKnob.style.left = (vol * 100) + '%';
            }
            
            volumeSlider.addEventListener('mousedown', (e) => {
                const updateVolume = (ev) => {
                    const rect = volumeSlider.getBoundingClientRect();
                    const x = ev.clientX - rect.left;
                    setVolume((x / rect.width) * 100);
                };
                updateVolume(e);
                const onMouseMove = (ev) => updateVolume(ev);
                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
            
            function updateStatusUI(state) {
                if (state === 'playing') {
                    statusBadge.classList.add('active');
                    statusText.textContent = 'LIVE';
                    mainIcon.classList.add('playing');
                    playIconSVG.innerHTML = iconPause;
                } else {
                    statusBadge.classList.remove('active');
                    statusText.textContent = 'OFF';
                    mainIcon.classList.remove('playing');
                    playIconSVG.innerHTML = iconPlay;
                    vuSegments.forEach(seg => seg.classList.remove('lit'));
                }
            }
            
            // Lógica de leitura de frequência e reprodução idêntica ao RadioZero.html
            async function playStream(url) {
                if (!url) {
                    alert("Este slot está vazio. Adicione um link válido nas configurações.");
                    return;
                }
                
                try {
                    loadingIndicator.style.display = 'block';
                    
                    audio.src = url;
                    audio.load();
                    
                    const playPromise = audio.play();
                    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 10000));
                    
                    await Promise.race([playPromise, timeoutPromise]);
                    
                    if (!window.audioCtx) {
                        window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        window.source = window.audioCtx.createMediaElementSource(audio);
                        window.analyser = window.audioCtx.createAnalyser();
                        window.analyser.fftSize = 64; 
                        window.analyser.smoothingTimeConstant = 0.85;
                        window.source.connect(window.analyser);
                        window.analyser.connect(window.audioCtx.destination);
                        window.dataArray = new Uint8Array(window.analyser.frequencyBinCount);
                    } else if (window.audioCtx.state === 'suspended') {
                        await window.audioCtx.resume();
                    }
                    
                    isPlaying = true;
                    isPaused = false;
                    loadingIndicator.style.display = 'none';
                    updateStatusUI('playing');
                    
                    function renderRealEQ() {
                        if (!isPlaying || isPaused) {
                            animationFrame = requestAnimationFrame(renderRealEQ);
                            return;
                        }
                        
                        try {
                            window.analyser.getByteFrequencyData(window.dataArray);
                            
                            let sum = 0;
                            for (let i = 0; i < window.dataArray.length; i++) {
                                sum += window.dataArray[i];
                            }
                            let avg = sum / window.dataArray.length;
                            
                            // Distribuição realista baseada no áudio lido
                            let litCount = Math.floor((avg / 255) * TOTAL_VU_SEGMENTS * 2.2);
                            
                            for (let i = 0; i < TOTAL_VU_SEGMENTS; i++) {
                                if (i < litCount) {
                                    vuSegments[i].classList.add('lit');
                                } else {
                                    vuSegments[i].classList.remove('lit');
                                }
                            }
                        } catch (error) {
                            console.error('EQ error:', error);
                        }
                        
                        animationFrame = requestAnimationFrame(renderRealEQ);
                    }
                    
                    if (animationFrame) cancelAnimationFrame(animationFrame);
                    animationFrame = requestAnimationFrame(renderRealEQ);
                    
                } catch (error) {
                    console.error('Stream error:', error);
                    loadingIndicator.style.display = 'none';
                    updateStatusUI('off');
                    alert("Erro ao conectar à rádio. Verifique a sua ligação ou se o link está acessível.");
                }
            }
            
            mainPlayBtn.addEventListener('click', () => {
                if (!isPlaying) {
                    playStream(currentStreamUrl);
                } else if (isPlaying && !isPaused) {
                    audio.pause();
                    isPaused = true;
                    updateStatusUI('off');
                    if (window.audioCtx) window.audioCtx.suspend();
                } else if (isPaused) {
                    audio.play().then(() => {
                        isPaused = false;
                        updateStatusUI('playing');
                        if (window.audioCtx && window.audioCtx.state === 'suspended') {
                            window.audioCtx.resume();
                        }
                    }).catch(err => {
                        playStream(currentStreamUrl);
                    });
                }
            });
            
            listBtn.addEventListener('click', () => {
                stationModal.style.display = 'flex';
            });
            closeStationModal.addEventListener('click', () => {
                stationModal.style.display = 'none';
            });
            
            adminBtn.addEventListener('click', () => {
                adminPassword.value = '';
                passwordError.style.display = 'none';
                passwordModal.style.display = 'flex';
            });
            
            enterAdminBtn.addEventListener('click', () => {
                if (adminPassword.value === ADMIN_PASSWORD) {
                    passwordModal.style.display = 'none';
                    createAdminTapes();
                    adminModal.style.display = 'flex';
                } else {
                    passwordError.style.display = 'block';
                    adminPassword.focus();
                }
            });
            
            cancelPasswordBtn.addEventListener('click', () => passwordModal.style.display = 'none');
            
            adminPassword.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') enterAdminBtn.click();
            });
            
            cancelAdminBtn.addEventListener('click', () => adminModal.style.display = 'none');
            
            saveAdminBtn.addEventListener('click', () => {
                const nameInputs = document.querySelectorAll('.tape-name-input');
                const urlInputs = document.querySelectorAll('.tape-url-input');
                const bannerInputs = document.querySelectorAll('.tape-banner-input');
                
                const newTapes = [];
                for (let i = 0; i < 10; i++) {
                    newTapes.push({
                        name: nameInputs[i].value,
                        url: urlInputs[i].value,
                        banner: bannerInputs[i].value
                    });
                }
                
                tapes = newTapes;
                localStorage.setItem('gospelTapes', JSON.stringify(tapes));
                
                currentStreamUrl = tapes[selectedTapeIndex].url;
                stationName.textContent = tapes[selectedTapeIndex].name;
                runningBanner.textContent = tapes[selectedTapeIndex].banner;
                createStationsList();
                
                adminModal.style.display = 'none';
                alert('Configurações salvas no navegador com sucesso!');
            });
            
            [stationModal, passwordModal, adminModal].forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) modal.style.display = 'none';
                });
            });
            
            audio.addEventListener('waiting', () => {
                loadingIndicator.style.display = 'block';
                loadingIndicator.textContent = 'Carregando...';
            });
            
            audio.addEventListener('canplay', () => loadingIndicator.style.display = 'none');
            audio.addEventListener('playing', () => loadingIndicator.style.display = 'none');
            
            // Inicialização Padrão
            setVolume(50);
            createStationsList();
            stationName.textContent = tapes[0].name;
            runningBanner.textContent = tapes[0].banner;
            updateStatusUI('off');
        })();
    </script>
</body>
</html>
